<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara Chill Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        capyBrown: '#8B5A2B',
                        capyLightBrown: '#D2B48C',
                        capyGreen: '#6B8E23',
                        capyLightGreen: '#A2CDB0',
                        capyBg: '#FDF5E6',
                    },
                    fontFamily: {
                        nunito: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FDF5E6;
            /* Warm off-white/beige */
            background-image: radial-gradient(#D2B48C 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
        }

        .btn-capy {
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(139, 90, 43, 0.3);
        }

        .btn-capy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(139, 90, 43, 0.4);
        }

        .btn-capy:active {
            transform: translateY(2px);
            box-shadow: 0 2px 4px rgba(139, 90, 43, 0.3);
        }

        .carpet {
            border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
            background: repeating-linear-gradient(45deg,
                    #6B8E23,
                    #6B8E23 10px,
                    #556b2f 10px,
                    #556b2f 20px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .bounce-anim {
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .hide {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Quiz Answer Animations */
        .correct-answer {
            background-color: #34D399 !important;
            /* Tailwind green-400 */
            color: white !important;
            border-color: #059669 !important;
            animation: pulseCorrect 0.5s;
        }

        .wrong-answer {
            background-color: #F87171 !important;
            /* Tailwind red-400 */
            color: white !important;
            border-color: #DC2626 !important;
            animation: shakeWrong 0.5s;
        }

        @keyframes pulseCorrect {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes shakeWrong {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }
        }
    </style>
</head>

<body class="min-h-screen text-capyBrown flex flex-col items-center justify-center p-4">

    <div id="app-container"
        class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-capyLightBrown relative fade-in">

        <!-- Header -->
        <header class="bg-capyLightGreen p-4 text-center border-b-4 border-capyLightBrown relative z-10">
            <h1 class="text-3xl font-black text-capyBrown tracking-wider drop-shadow-md">CapyQuiz Chill Zone</h1>
            <p class="text-capyBrown font-bold opacity-80">Relax, learn, and hang with the capybaras!</p>
        </header>

        <!-- LOBBY VIEW -->
        <main id="view-lobby" class="p-8 flex flex-col items-center justify-center min-h-[500px] relative">

            <div class="text-center mb-6 z-10">
                <h2 class="text-2xl font-bold mb-2">Welcome to the Lounge!</h2>
                <p>Interact with the mascot before starting.</p>
            </div>

            <!-- Mascot Area -->
            <div class="relative w-full max-w-md flex justify-center items-end h-64 mb-8">
                <!-- Action Buttons (Hovering sides) -->
                <div class="absolute left-0 top-1/2 -translate-y-1/2 flex flex-col gap-4 z-20">
                    <button onclick="changeMascot('sleep')"
                        class="btn-capy bg-capyLightBrown text-white font-bold py-2 px-4 rounded-full flex items-center gap-2">
                        <span>💤</span> Sleep
                    </button>
                    <button onclick="changeMascot('dance')"
                        class="btn-capy bg-capyLightBrown text-white font-bold py-2 px-4 rounded-full flex items-center gap-2">
                        <span>💃</span> Dance
                    </button>
                    <button onclick="changeMascot('eat')"
                        class="btn-capy bg-capyLightBrown text-white font-bold py-2 px-4 rounded-full flex items-center gap-2">
                        <span>🍉</span> Eat
                    </button>
                </div>

                <!-- Capybara Image -->
                <div class="relative z-10 flex flex-col items-center bounce-anim">
                    <!-- Using placeholder images that look somewhat like pixel art/cute animals based on colors -->
                    <img id="lobby-mascot"
                        src="https://placehold.co/200x200/8B5A2B/FFF?text=Capy+Idle\n(capy-idle.png)&font=Nunito"
                        alt="Capybara Mascot"
                        class="w-48 h-48 object-cover rounded-full border-4 border-capyGreen shadow-lg bg-capyBg">
                </div>

                <!-- Carpet -->
                <div class="absolute bottom-[-20px] w-3/4 h-16 carpet z-0"></div>
            </div>

            <!-- Controls -->
            <div class="flex flex-col sm:flex-row gap-4 mt-8 z-10 w-full max-w-md">
                <button onclick="startQuizFlow()"
                    class="btn-capy flex-1 bg-capyGreen hover:bg-green-700 text-white text-xl font-black py-4 px-6 rounded-2xl">
                    Check Availability (Play)
                </button>
                <div class="flex-1 flex flex-col gap-2">
                    <button onclick="playRandomQuiz()"
                        class="btn-capy bg-capyBrown hover:bg-yellow-800 text-white font-bold py-2 px-4 rounded-xl text-sm">
                        Quick Random Question
                    </button>
                    <div id="quick-feedback" class="text-center font-bold h-6 hidden rounded"></div>
                </div>
            </div>

            <!-- Hidden Quick Quiz Modal/Area for Lobby -->
            <div id="quick-quiz-area"
                class="hidden absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center p-6 backdrop-blur-sm">
                <h3 class="text-xl font-bold mb-4 text-capyGreen">Quick Trivia!</h3>
                <p id="quick-q-text" class="text-lg text-center mb-6 font-bold"></p>
                <div id="quick-q-options" class="flex flex-col gap-3 w-full max-w-sm">
                    <!-- Options injected here -->
                </div>
                <button onclick="closeQuickQuiz()" class="mt-6 text-capyBrown underline font-bold">Back to
                    Lobby</button>
            </div>
        </main>

        <!-- QUIZ VIEW -->
        <main id="view-quiz" class="hide p-6 md:p-8 flex flex-col md:flex-row gap-8 min-h-[500px]">

            <!-- Side Mascot -->
            <div
                class="w-full md:w-1/4 flex flex-col items-center justify-start border-b-2 md:border-b-0 md:border-r-4 border-capyLightBrown pb-4 md:pb-0 md:pr-4">
                <div class="sticky top-4 flex flex-col items-center">
                    <h3 class="font-bold text-lg mb-2 text-center">Your Buddy</h3>
                    <img id="quiz-mascot"
                        src="https://placehold.co/150x150/8B5A2B/FFF?text=Capy+Watching\n(capy-idle.png)&font=Nunito"
                        alt="Watching Capybara"
                        class="w-32 h-32 rounded-full border-4 border-capyGreen shadow-md mb-4 bg-capyBg">

                    <div class="bg-capyLightGreen p-3 rounded-xl w-full text-center shadow-inner">
                        <p class="font-bold text-sm uppercase tracking-wider text-capyBrown">Score</p>
                        <p id="current-score" class="text-3xl font-black text-capyBrown">0 / 5</p>
                    </div>
                </div>
            </div>

            <!-- Quiz Content -->
            <div class="w-full md:w-3/4 flex flex-col">
                <!-- Progress -->
                <div
                    class="mb-6 flex justify-between items-center bg-capyBg p-2 rounded-full border-2 border-capyLightBrown">
                    <span class="font-bold ml-4" id="question-tracker">Question 1 of 5</span>
                    <div class="w-1/2 bg-gray-200 rounded-full h-2.5 mr-4">
                        <div id="progress-bar" class="bg-capyGreen h-2.5 rounded-full" style="width: 20%"></div>
                    </div>
                </div>

                <!-- Question Area -->
                <div id="question-container" class="flex-1 flex flex-col justify-center">
                    <h2 id="question-text" class="text-2xl md:text-3xl font-bold mb-8 text-center text-gray-800">
                        Loading question...
                    </h2>

                    <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Options will be injected here via JS -->
                    </div>
                </div>

                <!-- Recap Area (Hidden initially) -->
                <div id="recap-container" class="hide flex-1 flex flex-col">
                    <h2 id="recap-title" class="text-3xl font-black mb-2 text-center">Batch Complete!</h2>
                    <p id="recap-message" class="text-center font-bold mb-6 text-lg"></p>

                    <div
                        class="bg-capyBg border-2 border-capyLightBrown rounded-2xl p-4 flex-1 overflow-y-auto max-h-[300px] shadow-inner mb-6">
                        <ul id="recap-list" class="space-y-4">
                            <!-- Recap items injected here -->
                        </ul>
                    </div>

                    <div class="flex justify-center gap-4">
                        <button onclick="startNextBatch()"
                            class="btn-capy bg-capyGreen hover:bg-green-700 text-white text-lg font-bold py-3 px-8 rounded-xl">
                            Next Batch
                        </button>
                        <button onclick="returnToLobby()"
                            class="btn-capy bg-capyLightBrown hover:bg-yellow-700 text-white text-lg font-bold py-3 px-8 rounded-xl">
                            Back to Lobby
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Background Decor -->
    <div class="fixed top-10 left-10 text-6xl opacity-20 -z-10 transform -rotate-12">🌿</div>
    <div class="fixed bottom-20 right-10 text-6xl opacity-20 -z-10 transform rotate-12">🍉</div>
    <div class="fixed top-1/4 right-20 text-4xl opacity-20 -z-10">🍊</div>
    <div class="fixed bottom-1/3 left-20 text-5xl opacity-20 -z-10">🛁</div>

    <script>
        // --- Data ---
        // Sample questions bank
        const questionBank = [
            { q: "What is the primary diet of a capybara?", options: ["Grass and aquatic plants", "Insects and bugs", "Small fish", "Fruits only"], a: "Grass and aquatic plants" },
            { q: "Capybaras are native to which continent?", options: ["Africa", "South America", "Australia", "Asia"], a: "South America" },
            { q: "Capybaras are closely related to which animal?", options: ["Pigs", "Guinea pigs", "Hippos", "Beavers"], a: "Guinea pigs" },
            { q: "What do capybaras use the water for?", options: ["Hiding from predators", "Keeping their skin moist", "Regulating body temperature", "All of the above"], a: "All of the above" },
            { q: "Are capybaras social animals?", options: ["Yes, they live in large groups", "No, they are solitary", "Only during mating season", "They pair mate for life and live alone"], a: "Yes, they live in large groups" },
            { q: "What is a group of capybaras called?", options: ["A herd", "A pack", "A school", "A flock"], a: "A herd" },
            { q: "Can capybaras hold their breath underwater?", options: ["Yes, for about 5 minutes", "No, they keep their noses out", "Yes, for 30 minutes", "Yes, up to an hour"], a: "Yes, for about 5 minutes" },
            { q: "What sound do capybaras make to communicate?", options: ["Roars", "Barks, whistles, and purrs", "Howls", "They are completely silent"], a: "Barks, whistles, and purrs" },
            { q: "Why do other animals like to sit on capybaras?", options: ["They provide warmth", "They are chill and don't mind", "They offer protection", "To cross rivers"], a: "They are chill and don't mind" },
            { q: "What is the largest rodent in the world?", options: ["Beaver", "Porcupine", "Capybara", "Nutria"], a: "Capybara" }
        ];

        // Placeholder image URLs acting as our assets
        const assets = {
            idle: 'https://placehold.co/200x200/8B5A2B/FFF?text=Capy+Idle\n(capy-idle.png)&font=Nunito',
            sleep: 'https://placehold.co/200x200/6B8E23/FFF?text=Capy+Zzz\n(capy-sleep.png)&font=Nunito',
            dance: 'https://placehold.co/200x200/F59E0B/FFF?text=Capy+Dance\n(capy-dance.png)&font=Nunito',
            eat: 'https://placehold.co/200x200/EF4444/FFF?text=Capy+Munch\n(capy-eat.png)&font=Nunito',
            excited: 'https://placehold.co/200x200/10B981/FFF?text=Capy+Yay!\n(capy-excited.png)&font=Nunito',
            clap: 'https://placehold.co/200x200/3B82F6/FFF?text=Capy+Clap\n(capy-clap.png)&font=Nunito',
            sad: 'https://placehold.co/200x200/6B7280/FFF?text=Capy+Sad\n(capy-sad.png)&font=Nunito',
        };

        // State variables
        let currentBatch = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = []; // Store {q, userAns, correctAns, isCorrect}
        let isAnswering = false;

        // --- STREAMING_CHUNK:Lobby Functions ---

        function changeMascot(action) {
            const img = document.getElementById('lobby-mascot');
            img.src = assets[action] || assets.idle;

            // Add a little pop effect
            img.classList.remove('bounce-anim');
            img.style.transform = 'scale(1.1)';
            setTimeout(() => {
                img.style.transform = 'scale(1)';
                img.classList.add('bounce-anim');
            }, 200);

            // Reset to idle after 3 seconds if not clicked again
            clearTimeout(window.mascotTimeout);
            window.mascotTimeout = setTimeout(() => {
                img.src = assets.idle;
            }, 3000);
        }

        function playRandomQuiz() {
            const randomQ = questionBank[Math.floor(Math.random() * questionBank.length)];
            const qText = document.getElementById('quick-q-text');
            const qOptions = document.getElementById('quick-q-options');
            const area = document.getElementById('quick-quiz-area');

            qText.innerText = randomQ.q;
            qOptions.innerHTML = '';

            // Shuffle options
            let options = [...randomQ.options].sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-capy bg-capyBg border-2 border-capyLightBrown text-capyBrown font-bold py-3 px-4 rounded-xl text-left hover:bg-capyLightGreen transition-colors';
                btn.innerText = opt;
                btn.onclick = () => handleQuickAnswer(btn, opt, randomQ.a);
                qOptions.appendChild(btn);
            });

            area.classList.remove('hidden');
        }

        function handleQuickAnswer(btn, selected, correct) {
            // Disable all buttons in quick quiz
            const btns = document.getElementById('quick-q-options').querySelectorAll('button');
            btns.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct-answer');
                setTimeout(() => { closeQuickQuiz(); showLobbyFeedback(true); }, 1000);
            } else {
                btn.classList.add('wrong-answer');
                // Highlight correct
                btns.forEach(b => {
                    if (b.innerText === correct) b.classList.add('correct-answer');
                });
                setTimeout(() => { closeQuickQuiz(); showLobbyFeedback(false); }, 1500);
            }
        }

        function closeQuickQuiz() {
            document.getElementById('quick-quiz-area').classList.add('hidden');
        }

        function showLobbyFeedback(isCorrect) {
            const fb = document.getElementById('quick-feedback');
            fb.classList.remove('hidden');
            if (isCorrect) {
                fb.innerText = "Correct! Capy is pleased. 🌿";
                fb.className = "text-center font-bold h-6 rounded text-green-600 fade-in";
                changeMascot('excited');
            } else {
                fb.innerText = "Oops! Try again next time. 🍂";
                fb.className = "text-center font-bold h-6 rounded text-red-500 fade-in";
                changeMascot('sad');
            }
            setTimeout(() => { fb.classList.add('hidden'); }, 3000);
        }

        // --- STREAMING_CHUNK:Quiz Flow Functions ---

        function startQuizFlow() {
            document.getElementById('view-lobby').classList.add('hide');
            document.getElementById('view-quiz').classList.remove('hide');
            startNextBatch();
        }

        function returnToLobby() {
            document.getElementById('view-quiz').classList.add('hide');
            document.getElementById('view-lobby').classList.remove('hide');
            document.getElementById('lobby-mascot').src = assets.idle;
        }

        function startNextBatch() {
            // Get 5 random questions (for demo, just slicing or shuffling)
            let shuffled = [...questionBank].sort(() => Math.random() - 0.5);
            currentBatch = shuffled.slice(0, 5);

            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];

            document.getElementById('recap-container').classList.add('hide');
            document.getElementById('question-container').classList.remove('hide');
            document.getElementById('quiz-mascot').src = assets.idle;

            updateScoreDisplay();
            loadQuestion();
        }

        // --- STREAMING_CHUNK:Rendering Questions and Handling Logic ---

        function loadQuestion() {
            if (currentQuestionIndex >= currentBatch.length) {
                showRecap();
                return;
            }

            isAnswering = false;
            const q = currentBatch[currentQuestionIndex];

            // Update UI trackers
            document.getElementById('question-tracker').innerText = `Question ${currentQuestionIndex + 1} of 5`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / 5) * 100}%`;

            document.getElementById('question-text').innerText = q.q;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Shuffle options
            let options = [...q.options].sort(() => Math.random() - 0.5);

            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-capy w-full bg-white border-2 border-capyLightBrown text-capyBrown font-bold py-4 px-6 rounded-2xl text-left hover:bg-capyLightGreen transition-colors text-lg flex items-center shadow-sm';

                // Add letter prefix for looks
                const letter = String.fromCharCode(65 + index);
                btn.innerHTML = `<span class="bg-capyLightBrown text-white rounded w-8 h-8 flex items-center justify-center mr-3 font-black">${letter}</span> ${opt}`;

                btn.onclick = () => handleAnswer(btn, opt, q.a, q.q);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(btn, selected, correct, questionText) {
            if (isAnswering) return;
            isAnswering = true;

            const isCorrect = selected === correct;
            if (isCorrect) score++;

            // Save answer for recap
            userAnswers.push({
                q: questionText,
                userAns: selected,
                correctAns: correct,
                isCorrect: isCorrect
            });

            // UI Feedback
            const allBtns = document.getElementById('options-container').querySelectorAll('button');

            if (isCorrect) {
                btn.classList.add('correct-answer');
                // Temporarily make mascot happy
                document.getElementById('quiz-mascot').src = assets.clap;
            } else {
                btn.classList.add('wrong-answer');
                // Highlight correct answer
                allBtns.forEach(b => {
                    if (b.innerText.includes(correct)) {
                        b.classList.add('correct-answer');
                    }
                });
                // Temporarily make mascot sad
                document.getElementById('quiz-mascot').src = assets.sad;
            }

            // Disable all buttons
            allBtns.forEach(b => b.disabled = true);

            updateScoreDisplay();

            // Next question delay
            setTimeout(() => {
                document.getElementById('quiz-mascot').src = assets.idle;
                currentQuestionIndex++;
                loadQuestion();
            }, 1500);
        }

        function updateScoreDisplay() {
            document.getElementById('current-score').innerText = `${score} / 5`;
        }

        // --- STREAMING_CHUNK:Recap and End of Batch Logic ---

        function showRecap() {
            document.getElementById('question-container').classList.add('hide');
            document.getElementById('recap-container').classList.remove('hide');
            document.getElementById('progress-bar').style.width = `100%`;

            // Set final Mascot mood
            const mascotImg = document.getElementById('quiz-mascot');
            const title = document.getElementById('recap-title');
            const msg = document.getElementById('recap-message');

            if (score === 5) {
                mascotImg.src = assets.excited;
                title.innerText = "Perfect Score! 🎉";
                title.className = "text-3xl font-black mb-2 text-center text-green-600";
                msg.innerText = "The capybaras are throwing a party for you!";
            } else if (score > 3) {
                mascotImg.src = assets.clap;
                title.innerText = "Great Job! 👏";
                title.className = "text-3xl font-black mb-2 text-center text-blue-600";
                msg.innerText = "You know your capy facts pretty well.";
            } else {
                mascotImg.src = assets.sad;
                title.innerText = "Need More Chill Time 🍂";
                title.className = "text-3xl font-black mb-2 text-center text-red-500";
                msg.innerText = "Study up and try again!";
            }

            // Build Recap List
            const list = document.getElementById('recap-list');
            list.innerHTML = '';

            userAnswers.forEach((ans, idx) => {
                const li = document.createElement('li');
                li.className = `p-3 rounded-xl border ${ans.isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`;

                li.innerHTML = `
                    <p class="font-bold text-gray-800 mb-1">Q${idx + 1}: ${ans.q}</p>
                    <div class="text-sm">
                        ${!ans.isCorrect ? `<p class="text-red-600 line-through">Your Answer: ${ans.userAns}</p>` : ''}
                        <p class="text-green-700 font-bold">Correct Answer: ${ans.correctAns}</p>
                    </div>
                `;
                list.appendChild(li);
            });
        }
    </script>
</body>

</html>
